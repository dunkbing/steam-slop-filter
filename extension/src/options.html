<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Steam Slop Filter</title>
  <style>
    body { margin: 0; min-width: 320px; padding: 16px; background: #1b2838; color: #c7d5e0; font: 13px/1.45 Arial, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 16px; color: #fff; }
    fieldset { margin: 0 0 12px; padding: 8px 10px; border: 1px solid #2a475e; border-radius: 4px; }
    legend { padding: 0 4px; color: #66c0f4; }
    label { display: block; margin: 4px 0; }
    input[type=number] { box-sizing: border-box; width: 70px; padding: 5px; border: 1px solid #2a475e; border-radius: 3px; background: #0e141b; color: #fff; }
    .row { display: flex; gap: 12px; }
    .hint { color: #8f98a0; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Steam Slop Filter</h1>

  <fieldset>
    <legend>Flagged games</legend>
    <label><input type="radio" name="mode" value="dim"> Dim them</label>
    <label><input type="radio" name="mode" value="hide"> Hide them</label>
    <label><input type="radio" name="mode" value="badge"> Only show a red badge</label>
  </fieldset>

  <fieldset>
    <legend>Community votes</legend>
    <div class="row">
      <label>Min. slop votes <input type="number" id="minVotes" min="1" step="1"></label>
      <label>Min. slop share (%) <input type="number" id="slopRatio" min="1" max="100" step="5"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Steam AI disclosure</legend>
    <label><input type="checkbox" id="disclosureIsSlop"> Treat any AI disclosure as slop</label>
    <div class="hint">Many good games disclose small things like TTS voices, so this is off by default.</div>
  </fieldset>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
